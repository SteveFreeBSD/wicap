name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    env:
      WICAP_INTERNAL_SECRET: "ci-internal-secret-123"
      WICAP_INTERNAL_SECRET_REQUIRED: "false"
      WICAP_SQL_PASSWORD: "ci-sql-password-123"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unixodbc-dev libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Review gate
        run: ./scripts/review_gate.sh

      - name: Replay fixtures
        run: python -m replay_driver --batch tests/fixtures/manifest.json
