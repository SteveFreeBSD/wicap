# WICAP mypy Configuration
# Type checking configuration for static analysis
#
# Usage:
#   mypy nexus/           # Check nexus package
#   mypy nexus/ --strict  # Strict mode (more checks)
#
# Install: pip install mypy types-requests

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
pretty = True

# Start permissive, tighten over time
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True

# Strict mode targets (enable as code is annotated)
# disallow_untyped_defs = True
# disallow_any_generics = True
# disallow_incomplete_defs = True

# Per-module overrides
[mypy-nexus.config]
disallow_untyped_defs = True

[mypy-nexus.risk_scorer]
disallow_untyped_defs = True

[mypy-nexus.device_fingerprint]
disallow_untyped_defs = True

# Relax for test files
[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = True

[mypy-test_*]
disallow_untyped_defs = False
ignore_errors = True

# Third-party stubs not available
[mypy-scapy.*]
ignore_missing_imports = True

[mypy-pyodbc.*]
ignore_missing_imports = True

[mypy-pyshark.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True
