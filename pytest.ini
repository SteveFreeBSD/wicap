[pytest]
# WICAP Test Configuration
# Run with: pytest tests/ -v

testpaths = tests nexus/tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*

# Test markers for selective execution
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: requires database connection
    e2e: end-to-end tests requiring full system
    unit: fast unit tests
    perf_smoke: quick performance sanity checks
    perf_regression: performance regression gates

# Default options
addopts = -v --tb=short --strict-markers -p no:cacheprovider -p no:langsmith_plugin --import-mode=append

# Keep test output clean in environments where optional pytest plugins are installed.
filterwarnings =
    ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:langsmith\\.schemas

# Timeout for individual tests (requires pytest-timeout)
# timeout = 60

# Coverage (requires pytest-cov)
# addopts = --cov=nexus --cov-report=term-missing
